name: WinUI 3 Unpackaged EXE

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  Artifact_Name: Build Output

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, x86, ARM64]
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
        global-json-file: '' 

    # Очищено от флагов архитектуры -r, чтобы тесты и второстепенные библиотеки не выдавали ошибку
    - name: Restore the application
      run: dotnet restore MyPhone.sln --disable-parallel

    # Архитектура и платформа теперь изолированно применяются только к исполняемому проекту
    - name: Publish EXE Application
      run: |
        dotnet publish MyPhone/MyPhone.csproj -c ${{ matrix.configuration }} -r win-${{ matrix.platform }} --no-restore -p:PublishReadyToRun=false /p:Platform=${{ matrix.platform }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.Artifact_Name }}-${{ matrix.platform }}
        path: MyPhone/bin/${{ matrix.platform }}/${{ matrix.configuration }}/net6.0-windows10.*/win-${{ matrix.platform }}/publish/
