name: WinUI 3 Unpackaged EXE

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  Artifact_Name: Build Output

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, x86]
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Restore the application
      run: dotnet restore MyPhone.sln

    - name: Build EXE Application
      run: |
        msbuild MyPhone/MyPhone.csproj /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=false

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.Artifact_Name }}-${{ matrix.platform }}
        path: MyPhone/bin/${{ matrix.platform }}/${{ matrix.configuration }}/net6.0-windows10.*/
